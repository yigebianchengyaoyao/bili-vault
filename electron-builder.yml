appId: local.bilivault.app
productName: BiliVault
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
extraResources:
  - from: tools
    to: tools
    filter:
      - yt-dlp.exe
      - ffmpeg.exe
win:
  target: portable
  signAndEditExecutable: false
portable:
  artifactName: BiliVault-${version}-Windows-x64.exe
